name: Daily Scanner Diagnostic & Report Aggregator

on:
  schedule:
    - cron: '0 10 * * 1-5' # Runs automatically at 3:30 PM IST (10:00 AM UTC), Monday to Friday
  workflow_dispatch: # Allows manual trigger anytime from GitHub interface

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install pandas yfinance scikit-learn
    - run: python train_ml.py
    - name: Commit Updated Report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ml_report.json
        git commit -m "🤖 Auto-Updated AI Diagnostic Report [skip ci]" || echo "No changes"
        git push
